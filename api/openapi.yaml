  /v1/seller/address/resolve:
    post:
      description: "Resolve a customer address to its normalized form for sales tax\
        \ calculation, and compute its taxable jurisdiction(s). The address fields\
        \ are provided at the top level of the request body. This endpoint uses the\
        \ same address resolution that tax calculation relies on, so a successful\
        \ response means the address would process on an invoice. Resolving international\
        \ addresses to street-level is a premium feature. Please contact hello@anrok.com\
        \ for more information to enable this on your seller account."
      operationId: addressResolve
      requestBody:
        content:
          application/json:
            examples:
              usAddress:
                summary: US address
                value:
                  country: US
                  line1: 100 Fake St
                  city: San Francisco
                  region: CA
                  postalCode: "94111"
              nonUsAddress:
                summary: Address outside the US and Canada
                value:
                  country: France
                  line1: 55 Rue du Faubourg Saint-Honoré
                  city: Paris
                  postalCode: "75008"
            schema:
              $ref: '#/components/schemas/CustomerAddress'
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                usAddress:
                  summary: Full address returned for US/Canada
                  value:
                    resolvedAddress:
                      country: United States
                      line1: 100 Fake St
                      city: San Francisco
                      region: CA
                      postalCode: "94111"
                    jurisdictions:
                    - id: us-CA
                      name: California
                nonUsAddress:
                  summary: Country-only resolution outside the US and Canada
                  value:
                    resolvedAddress:
                      country: France
                      line1: null
                      city: null
                      region: null
                      postalCode: null
                    jurisdictions:
                    - id: eu-oss
                      name: EU OSS
              schema:
                $ref: '#/components/schemas/ResolveAddressSuccess'
          description: OK
        "400":
          content:
            application/json:
              examples:
                unrecognizedField:
                  summary: An unrecognized property was provided
                  value: "Request body: Unrecognized key(s) in object: 'line2'"
              schema:
                type: string
          description: Bad Request
        "409":
          content:
            application/json:
              examples:
                addressCouldNotResolve:
                  summary: The address could not be resolved to a taxable jurisdiction
                  value:
                    type: addressCouldNotResolve
                jurisNotFound:
                  summary: The address resolved but no matching jurisdiction was found
                  value:
                    type: jurisNotFound
                    message: No jurisdiction found for the resolved address.
                externalServiceError:
                  summary: An upstream address resolution service error occurred
                  value:
                    type: externalServiceError
              schema:
                $ref: '#/components/schemas/addressResolve_409_response'
          description: Conflict
        "429":
          $ref: '#/components/responses/RateLimit'
      summary: Resolve an address
      tags:
      - Address resolution
      x-codeSamples:
      - lang: cURL
        source: |
          apiToken='sxxx/saxxx/secret.xxx'

          curl -X POST https://api.anrok.com/v1/seller/address/resolve \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $apiToken" \
            -d '{
              "country": "US",
              "line1": "100 Fake St",
              "city": "San Francisco",
              "region": "CA",
              "postalCode": "94111"
            }'
