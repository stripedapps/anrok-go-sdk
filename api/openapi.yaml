  schemas:
    CustomerName:
      description: The name of the customer. This is used for display purposes only.
      type: string
    CreateCustomer:
      example:
        emailAddress: emailAddress
        name: name
        id: id
      properties:
        id:
          description: "Your unique identifier for this customer. \nThis must exactly\
            \ match the customer ID that your billing system or integration  will\
            \ send on transactions, so that the customer's transactions and exemption\
            \ certificates link up. For Anrok-native billing integrations, customer\
            \ IDs are prefixed with the integration type (for example `stripe:cus_K39sWBu92Lo`).\
            \  Customer IDs are unique across the entire seller account.\n"
          type: string
        name:
          description: The name of the customer. This is used for display purposes
            only.
          type: string
        emailAddress:
          description: Optional email address of the customer.
          format: email
          nullable: true
          type: string
      required:
      - id
      - name
    CustomerResponse:
      example:
        emailAddress: emailAddress
        name: name
        id: id
      properties:
        id:
          description: Your unique identifier for this customer.
          type: string
        name:
          description: The name of the customer. This is used for display purposes
            only.
          type: string
        emailAddress:
          description: "The email address of the customer, if one has been provided."
          format: email
          nullable: true
          type: string
      required:
      - emailAddress
      - id
      - name
    CustomerId:
      description: |
        The Anrok customer ID used to link transactions for the same customer and to look up tax exemption certificates for a customer. This is typically the billing system's customer ID with a prefix to disambiguate.
        - If customerId is provided without customerName, that customer object must
          already exist in Anrok.
        - If both customerId and customerName are provided, the customer object will
          be created if it is not already present.
        - Customer IDs are unique across the entire seller account.
      type: string
    CustomerCertificateFile:
      example:
        contentsBase64: contentsBase64
        name: name
      properties:
        name:
          description: File name
          type: string
        contentsBase64:
          description: Base64 encoded certificate image contents
          type: string
      required:
      - contentsBase64
      - name
    CustomerCertificateJuris:
      example:
        effectiveDateEndi: 2000-01-23
        notes: notes
        registrationId: registrationId
        jurisId: us-AK
      properties:
        jurisId:
          description: Jurisdiction ID for which this exemption should apply (US only).
          enum:
          - us-AK
          - us-AL
          - us-AR
          - us-AS
          - us-AZ
          - us-CA
          - us-CO
          - us-CT
          - us-DC
          - us-DE
          - us-FL
          - us-GA
          - us-GU
          - us-HI
          - us-IA
          - us-ID
          - us-IL
          - us-IN
          - us-KS
          - us-KY
          - us-LA
          - us-MA
          - us-MD
          - us-ME
          - us-MI
          - us-MN
          - us-MO
          - us-MP
          - us-MS
          - us-MT
          - us-NC
          - us-ND
          - us-NE
          - us-NH
          - us-NJ
          - us-NM
          - us-NV
          - us-NY
          - us-OH
          - us-OK
          - us-OR
          - us-PA
          - us-PR
          - us-RI
          - us-SC
          - us-SD
          - us-TN
          - us-TX
          - us-UT
          - us-VA
          - us-VI
          - us-VT
          - us-WA
          - us-WI
          - us-WV
          - us-WY
          type: string
        registrationId:
          description: Registration ID for jurisdiction. This is used for display
            purposes only.
          type: string
        effectiveDateEndi:
          description: Expiration date of certificate in this jurisdiction
          format: date
          type: string
        notes:
          description: Optional internal notes. This is used for display purposes
            only.
          type: string
      required:
      - jurisId
    CustomerCertificate:
      example:
        exemptionNumber: exemptionNumber
        notes: notes
        customerId: customerId
        effectiveDateBegin: 2000-01-23
        certificateFile:
          contentsBase64: contentsBase64
          name: name
        type: agricultural
        jurises:
        - effectiveDateEndi: 2000-01-23
          notes: notes
          registrationId: registrationId
          jurisId: us-AK
        - effectiveDateEndi: 2000-01-23
          notes: notes
          registrationId: registrationId
          jurisId: us-AK
        customerName: customerName
      properties:
        customerId:
          description: |
            The Anrok customer ID used to link transactions for the same customer and to look up tax exemption certificates for a customer. This is typically the billing system's customer ID with a prefix to disambiguate.
            - If customerId is provided without customerName, that customer object must
              already exist in Anrok.
            - If both customerId and customerName are provided, the customer object will
              be created if it is not already present.
            - Customer IDs are unique across the entire seller account.
          type: string
        customerName:
          description: The name of the customer. This is used for display purposes
            only.
          type: string
        effectiveDateBegin:
          description: Effective date of certificate
          format: date
          type: string
        exemptionNumber:
          description: Certificate exemption number. This is used for display purposes
            only.
          type: string
        notes:
          description: Optional internal notes.
          type: string
        type:
          description: |
            The type of exemption the certificate represents. If omitted or null, no type is recorded.

            - `agricultural`: agricultural use.
            - `directPay`: direct pay permit.
            - `educational`: educational institution.
            - `energy`: energy-related exemption.
            - `governmentFederal`: federal government entity.
            - `governmentOther`: other government entity.
            - `governmentState`: state government entity.
            - `healthcare`: healthcare organization.
            - `manufacturing`: used in manufacturing.
            - `nativeAmericanTribal`: Native American tribal entity.
            - `nonprofit`: nonprofit organization.
            - `other`: other exemption type.
            - `religious`: religious organization.
            - `resale`: purchased for resale.
            - `researchDevelopment`: research and development use.
          enum:
          - agricultural
          - directPay
          - educational
          - energy
          - governmentFederal
          - governmentOther
          - governmentState
          - healthcare
          - manufacturing
          - nativeAmericanTribal
          - nonprofit
          - other
          - religious
          - resale
          - researchDevelopment
          - null
          nullable: true
          type: string
        certificateFile:
          $ref: '#/components/schemas/CustomerCertificateFile'
        jurises:
          description: Jurisdictions for which certificate applies
          items:
            $ref: '#/components/schemas/CustomerCertificateJuris'
          type: array
      required:
      - certificateFile
      - customerId
      - effectiveDateBegin
      - jurises
    CustomerCertificateJurisResponse:
      example:
        effectiveDateEndi: 2000-01-23
        notes: notes
        registrationId: registrationId
        jurisId: jurisId
      properties:
        jurisId:
          description: Jurisdiction ID for which this exemption applies.
          type: string
        registrationId:
          description: Registration ID for the jurisdiction. This is used for display
            purposes only.
          type: string
        effectiveDateEndi:
          description: Expiration date of the certificate in this jurisdiction. Null
            if the certificate has no expiration date in this jurisdiction.
          format: date
          nullable: true
          type: string
        notes:
          description: Optional internal notes. This is used for display purposes
            only.
          type: string
      required:
      - effectiveDateEndi
      - jurisId
      - notes
      - registrationId
    CustomerCertificateResponse:
      example:
        expiryDate: 2000-01-23
        exemptionNumber: exemptionNumber
        notes: notes
        customerId: customerId
        createdTime: 2000-01-23T04:56:07.000+00:00
        effectiveDateBegin: 2000-01-23
        id: id
        type: agricultural
        jurises:
        - effectiveDateEndi: 2000-01-23
          notes: notes
          registrationId: registrationId
          jurisId: jurisId
        - effectiveDateEndi: 2000-01-23
          notes: notes
          registrationId: registrationId
          jurisId: jurisId
        customerName: customerName
        status: active
      properties:
        id:
          description: The Anrok-assigned ID of the certificate.
          type: string
        status:
          description: |
            The current status of the certificate.

            - `active`: the certificate is valid.
            - `expiringSoon`: the certificate is valid but expires within 60 days in at least one jurisdiction.
            - `expired`: the certificate has expired in every jurisdiction it covers.
            - `archived`: the certificate has been archived.
          enum:
          - active
          - expiringSoon
          - expired
          - archived
          type: string
        customerId:
          description: The Anrok customer ID of the customer the certificate belongs
            to.
          type: string
        customerName:
          description: The name of the customer.
          type: string
        createdTime:
          description: The time at which the certificate was created in Anrok.
          format: date-time
          type: string
        effectiveDateBegin:
          description: Effective date of the certificate.
          format: date
          type: string
        expiryDate:
          description: The earliest expiration date across all jurisdictions covered
            by the certificate. Null if no jurisdiction has an expiration date set.
          format: date
          nullable: true
          type: string
        exemptionNumber:
          description: Certificate exemption number.
          type: string
        notes:
          description: Optional internal notes.
          type: string
        type:
          description: |
            The type of exemption the certificate represents. Null if no type has been recorded.

            - `agricultural`: agricultural use.
            - `directPay`: direct pay permit.
            - `educational`: educational institution.
            - `energy`: energy-related exemption.
            - `governmentFederal`: federal government entity.
            - `governmentOther`: other government entity.
            - `governmentState`: state government entity.
            - `healthcare`: healthcare organization.
            - `manufacturing`: used in manufacturing.
            - `nativeAmericanTribal`: Native American tribal entity.
            - `nonprofit`: nonprofit organization.
            - `other`: other exemption type.
            - `religious`: religious organization.
            - `resale`: purchased for resale.
            - `researchDevelopment`: research and development use.
          enum:
          - agricultural
          - directPay
          - educational
          - energy
          - governmentFederal
          - governmentOther
          - governmentState
          - healthcare
          - manufacturing
          - nativeAmericanTribal
          - nonprofit
          - other
          - religious
          - resale
          - researchDevelopment
          - null
          nullable: true
          type: string
        jurises:
          description: The jurisdictions to which the certificate applies.
          items:
            $ref: '#/components/schemas/CustomerCertificateJurisResponse'
          type: array
      required:
      - createdTime
      - customerId
      - customerName
      - effectiveDateBegin
      - exemptionNumber
      - expiryDate
      - id
      - jurises
      - notes
      - status
      - type
    TransactionLineItem:
