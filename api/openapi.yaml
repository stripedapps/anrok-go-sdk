components:
  examples:
    ConflictTaxDateTooFarInFuture:
      summary: Anrok accepts dates up to 31 days in the future.
      value:
        type: taxDateTooFarInFuture
    ConflictTaxDateTooFarInPast:
      summary: "Anrok only accepts dates on or after Jan 1, 1999."
      value:
        type: taxDateTooFarInPast
    ConflictAccountingTimeZoneNotSetForSeller:
      summary: Cannot determine accounting date from accountingTime without time zone
      value:
        type: accountingTimeZoneNotSetForSeller
    ConflictProductExternalIdUnknown:
      summary: Product IDs must have already been configured in Anrok
      value:
        type: productExternalIdUnknown
        productExternalId: my-new-product-id
  parameters:
    CustomerId:
      description: |
        The customer ID. URL-encode the ID if it contains special characters such as `:` or `/`.
      explode: false
      in: path
      name: customerId
      required: true
      schema:
        type: string
      style: simple
    CertificateId:
      description: ID of the certificate.
      explode: false
      in: path
      name: certificateId
      required: true
      schema:
        type: string
      style: simple
    TransactionId:
      description: ID of the transaction you want to void.
      explode: false
      in: path
      name: transactionId
      required: true
      schema:
        type: string
      style: simple
    IntegrationId:
      description: Your unique integration ID.
      explode: false
      in: path
      name: integrationId
      required: true
      schema:
        type: string
      style: simple
    JurisId:
      description: The ID of the jurisdiction of the filing.
      explode: false
      in: path
      name: jurisId
      required: true
      schema:
        type: string
      style: simple
    JurisFilingId:
      description: The ID of the filing. This is a unique identifier for the filing
        within the jurisdiction.
      explode: false
      in: path
      name: jurisFilingId
      required: true
      schema:
        type: string
      style: simple
    ProductExternalId:
      description: The external ID of the product.
      explode: false
      in: path
      name: externalId
      required: true
      schema:
        type: string
      style: simple
  requestBodies:
    Empty:
      content:
        application/json:
          examples:
            emptyExample:
              summary: Empty request body
              value: {}
          schema:
            type: object
      required: true
    ListCustomers:
      content:
        application/json:
          examples:
            firstPage:
              summary: List customers from the beginning
              value: {}
            cursor:
              summary: Cursor-based pagination
              value:
                cursor: eyJleGFtcGxlIjoidGhpcyBpcyBhbiBleGFtcGxlIGN1cnNvciJ9
                limit: 5
          schema:
            $ref: '#/components/schemas/customersList_request'
      required: true
    ListCertificates:
      content:
        application/json:
          examples:
            noFilter:
              summary: List all certificates
              value: {}
            customerIdFilter:
              summary: Filter certificates by customer ID
              value:
                filter:
                  customerId: v1:1292
            statusFilter:
              summary: Filter certificates by status
              value:
                filter:
                  status: expiringSoon
            cursor:
              summary: Cursor-based pagination
              value:
                cursor: eyJleGFtcGxlIjoidGhpcyBpcyBhbiBleGFtcGxlIGN1cnNvciJ9
                limit: 5
          schema:
            $ref: '#/components/schemas/certificatesList_request'
      required: true
    CreateCertificateRequest:
      content:
        application/json:
          example:
